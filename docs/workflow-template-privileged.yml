# Lupa: Fluxo B (privileged). Posts the review produced by the PR run.
# Runs in the base repository context. It only downloads the artifact and posts it:
# no checkout, no scanners, no LLM. Replace OWNER and the action SHA below.
name: Lupa (post)

on:
  workflow_run:
    workflows: ["Lupa"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-reviewer-priv-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# SARIF: this privileged flow never uploads SARIF. Code-scanning uploads happen only in the same-repo
# unprivileged flow (docs/workflow-template.yml). Fork runs carry no security-events: write, so an
# upload from here would be refused.
#
# Why the guards look like this:
# - Fork only (head_repository != this repository): same-repo PRs are reviewed and posted by the
#   unprivileged template. Running here too would post the same review twice.
# - conclusion != 'cancelled', not == 'success': the unprivileged job FAILS when fail_level gates a
#   high finding (exit 1). Requiring success would silently drop exactly the high-severity reviews.
#   The artifact checks keep this safe: pr-meta.json is required, the PR is derived from the
#   trusted workflow_run fields, and the head SHA, repository and branch must match the live PR.
jobs:
  post:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token (optional; App tokens may write on fork PRs)
        id: app
        if: vars.PR_REVIEWER_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_REVIEWER_APP_ID }}
          private-key: ${{ secrets.PR_REVIEWER_APP_KEY }}

      - name: Note posting credential
        if: always() && steps.app.outcome != 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          lupa: posting fork review with the workflow-run token (App token unavailable). For App-token posting set PR_REVIEWER_APP_ID / PR_REVIEWER_APP_KEY — see README (fork reviews)
          EOF
          echo "::notice::lupa: posting fork review with the workflow-run token (App token unavailable). For App-token posting set PR_REVIEWER_APP_ID / PR_REVIEWER_APP_KEY — see README (fork reviews)"

      - name: Download the PR run's review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-reviewer-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-reviewer-priv-out

      - name: Verify artifact files exist (fail before posting)
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pr-reviewer-priv-out
        run: |
          set -euo pipefail
          for f in diff.patch pr-meta.json findings.json; do
            test -s "$ARTIFACT_DIR/$f" || { echo "lupa: missing $f in artifact" >&2; exit 1; }
          done

      - name: Post review
        # Reporting only: it does not gate merges (the PR run's gate does).
        continue-on-error: true
        uses: cpenaforte/lupa@f973de093d01b1e2de489b5125f65f924ecfad1a
        env:
          PR_REVIEWER_ARTIFACT_DIR: ${{ runner.temp }}/pr-reviewer-priv-out
          PR_REVIEWER_TOKEN_TYPE: ${{ steps.app.outcome == 'success' && 'app' || 'workflow-run' }}
          PR_REVIEWER_ISSUE_FALLBACK: "false"
        with:
          github_token: ${{ steps.app.outputs.token || github.token }}
          post_comment: "true"
          fail_level: warning
